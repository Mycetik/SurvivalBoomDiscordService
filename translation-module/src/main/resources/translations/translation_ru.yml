$name: sbds:russian

translation:

  command:

    translation:

      description: "Показывает ваш текущий язык или устанавливает его"

      translation:
        name: "язык"
        description: "Язык который будет использовать бот в сообщения для вас"
        choices:
          sbds:ukrainian: "Українська"
          sbds:russian: "Русский"
          sbds:english: "English"

      show:
        $embed:
        description: "Ваш язык: `{translation.name}`."
        color: 34eb83

      set:
        $embed:
          title: "Язык установлен!"
          color: 34eb83
          description: "Вы установили ваш язык на `{translation.name}`."
