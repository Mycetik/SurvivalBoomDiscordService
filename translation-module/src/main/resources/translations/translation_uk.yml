$name: sbds:ukrainian

translation:

  command:

    translation:

      description: "Показує вашу поточну мову або встановлює її"

      translation:
        name: "мова"
        description: "Мова яку буде використовувати бот у повідомленнях для вас"
        choices:
          sbds:ukrainian: "Українська"
          sbds:russian: "Русский"
          sbds:english: "English"

      show:
        $embed:
          description: "Ваша поточна мова: `{translation.name}`."
          color: 34eb83

      set:
        $embed:
          title: "Мову встановлено!"
          color: 34eb83
          description: "Ви встановили мову `{translation.name}`."
