$name: sbds:english

translation:

  command:

    translation:

      description: "Shows your current language or sets it"

      translation:
        name: "language"
        description: "Language that will use bot in messages for you"
        choices:
          sbds:ukrainian: "Українська"
          sbds:russian: "Русский"
          sbds:english: "English"

      show:
        $embed:
          description: "Your current language: `{translation.name}`."
          color: 34eb83

      set:
        $embed:
          title: "Language set!"
          color: 34eb83
          description: "You set your language to `{translation.name}`."
