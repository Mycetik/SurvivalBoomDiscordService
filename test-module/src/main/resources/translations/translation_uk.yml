
$name: sbds:ukrainian

testmodule:

  event:

    on_message: "ХРЮ-ХРЮ-ХРЮ! Я СВІНТУС! :pig:"

  command:

    ephemeral-test:
      $embed:
        title: Вітаємо!
        description: Якщо ви бачите це повідомлення, значить зараз ви отримаєте бан!

    long-responding:
      first: "🪄 **База даних** оброблює ваш запит, зачекайте хвилинку..."
      loop: "🛰️ **Ви знаходитесь у черзі.** Ваша позиція `{index}`"
      success:
        $embed:
          title: "Успіх!"
          description: Ваш запит успішно прийнято, дякуємо за звернення!

    test-modal:

      modal:
        title: Напишіть фанфік
        label: Фанфік
        text: Жив був дракон, він усіх зжер, кінець...

      success: "**СВІНТУС!** {text}"

    ban:

      confirm:
        $embed:
          title: Підтвердження
          description: Ви дійсно хочете заблокувати користувача {user.mention}?
          color: f700ff
        $components:
          - name: confirm
            type: BUTTON
            style: SUCCESS
            emoji: ✅

          - name: cancel
            type: BUTTON
            style: DANGER
            emoji: ❌

      cancelled:
        $embed:
          title: Скасовано!
          description: Блокування користувача {user.mention} скасовано!

      success:
        $embed:
          title: Успіх!
          description: Користувача {user.mention} успішно заблоковано!



  context:

    message:
      $embed:
        title: "Перевірка контекстної команди"
        color: f700ff
        description: |
          Ви використали контекстну команду на повідомленні!
          Якщо ви бачите це повідомлення, значить - усе працює!
        fields:

          - name: "ID повідомлення:"
            value: "{id}"

          - name: "Автор:"
            value: "{author.mention}"

          - name: "Текст повідомлення:"
            value: "`{text}`"

    user:
      $embed:
        title: "Перевірка контекстної команди"
        color: f700ff
        description: |
          Ви використали контекстну команду на користувачеві!
          Якщо ви бачите це повідомлення, значить - усе працює!
        fields:
          - name: "Користувач:"
            value: "{user.mention}"
