
$name: "ukrainian"

test:

  modal:

    msg:
      $embed:
        title: "Тест Modal"
        description: |
          Це перевірка роботи Modal вікон в SurvivalBoom Discord Service!
          Натисність кнопку нижче, щоб викликати вікно!
      $components:
        - type: BUTTON
          name: modal
          label: "Тиць"
          emoji: "🦖"
          style: PRIMARY

    title: "Це - вікно"

    select.role.placeholder: "Оберіть роль..."
    select.role: "Роль"

    upload: "Завантаження файлу"

    text: "**Жирний текст**, *курсив*, __підкреслений__, ~~закреслений~~, `код`, > цитата"

    input.short.title: "Мале поле"
    input.short.placeholder: "хрю..."

    input.long.title: "Велике поле"
    input.long.placeholder: "хрю..."

  context:

    message:
      $embed:
        title: "Перевірка контекстної команди"
        color: f700ff
        description: |
          Ви використали контекстну команду на повідомленні!
          Якщо ви бачите це повідомлення, значить - усе працює!
        fields:

          - name: "ID повідомлення:"
            value: "{ID}"

          - name: "Автор:"
            value: "{AUTHOR}"

          - name: "Текст повідомлення:"
            value: "`{TEXT}`"

    user:
      $embed:
        title: "Перевірка контекстної команди"
        color: f700ff
        description: |
          Ви використали контекстну команду на користувачеві!
          Якщо ви бачите це повідомлення, значить - усе працює!
        fields:

          - name: "Користувач:"
            value: "{USER}"
