
sbds.message.text: "**Анальные микротранзакции.**"

sbds.message.legacy:
  $content: "Мамо, я дебіл!"
  $embeds:
    - author: "{BOT}"
      author-icon: "{BOT-AVATAR}"

      title: "Пропущено `{SKIP}` пісень!"
      color: 8f00ff
      description: |
        Зараз грає:
          - `{PLAYING-NAME}`
      fields:

        - name: "Тривалість"
          value: "`{PLAYING-DURATION}`"
          inline: true

        - name: "Джерело"
          value: "[{PLAYING-SOURCE}]({PLAYING-LINK})"
          inline: true

        - name: "Пісень в плейлісті"
          value: "`{PLAYLIST-SIZE}`"
          inline: true

  $components:

    - name: "musicmodule:back"
      type: BUTTON
      style: PRIMARY
      static: true
      emoji: "⏮"

    - name: "musicmodule:pause"
      type: BUTTON
      style: SUCCESS
      static: true
      emoji: "⏯"

    - name: "musicmodule:next"
      type: BUTTON
      style: PRIMARY
      static: true
      emoji: "⏭"

    - name: "musicmodule:stop"
      type: BUTTON
      style: DANGER
      static: true
      emoji: "🛑"

    - name: "musicmodule:lock"
      type: BUTTON
      style: SECONDARY
      static: true
      emoji: "🔒"

sbds.message.component:
  $components:
