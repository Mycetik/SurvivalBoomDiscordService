    Суверенність української держави, запобігання русифікації та зміцнення єдності українського народу.
      4.1 Заборонено спілкуватись російською мовою у чатах та поширювати наративи "да яка різниця якою мовою спілкуватись" або "мені зручно спілкуватись російською".
      4.2 Заборонено поширювати будь-який контент чи думки, що поширюють проросійські наративи, впливають на моральний дух української нації, розколюють українське суспільство. До цього входить "зрадойобство" - поширення неправдивої інформації із гіперболізацією корупції, державних проблем та конспірологічних теорій як от продаж електроенергії за кордон під час блекаутів.  
      4.3 Заборонена радикальна, примусова, силова політика українізації, наприклад: цькування, риторичне питання "чому не державною", клеймування "малоросом" без підстав.
      4.4 Заборонено поширення будь-якого російського контенту: культура, меми, медіа-персони, призов пограти у російські ігри.
  
