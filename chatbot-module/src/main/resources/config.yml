      5.2 Заборонено використовувати будь-які вразливості серверу, як от баги.
      5.3 Заборонено використовувати або поширювати будь-яке програмне забезпечення яке надає переваги над іншими гравцями (чіти, fullbright, x-ray, мінікарти на деяких режимах).
      5.4 Заборонено перешкоджати нормальній грі, як от забудовувати гравців, spawn-kill, а також об'єднувати у команди у режимах де це не передбачено або об'єднуватис із гравцями інших команд.
  
