      2.1 Заборонена будь-яка неадекватна поведінка, токсичність (цькування), образи інших учасників, пасивно-агресивні дії.
      2.2 Заборонено засмічування чату:
          Спам — масове розсилання повідомлень рекламного чи іншого характеру людям, які не висловили бажання її одержувати.
          Флуд — марнослів'я, повідомлення, яке займає (в багатьох випадках) великі обсяги і не несе якоїсь нової чи корисної інформації. (Або монотонне повторення повідомлення)
          Капс — зловживання ВЕЛИКИМИ БУКВАМИ.
          Оффтоп — великі обговорення тем не пов'язаних із SurvivalBoom або майнкрафтом взагалі. Якщо учасники бажають обговорити такі теми, вони мають створити ГІЛКУ у чаті, де мають право вільно спілкуватись не заважаючи головному чату.
      2.3 Заборонено поширення, виправдання і прояви деструктивних ідеологій та способів впливу, наприклад як: рашизм, фашизм, націонал-соціалізм, геноцид, комунізм та інших методів які зводяться до позбавлення базових прав людини.
      2.4 Заборонено публікувати або описувати контент сексуального (у чатах не позначених як NSFW) та насильницького характеру.
  
