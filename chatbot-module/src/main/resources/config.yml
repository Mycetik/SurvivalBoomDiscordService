  Правила SurvivalBoom:
  
    Загальне:
      1.1 Граючи на наших серверах, гравці погоджуються із усіма правилами наведеними нижче. У разі незгоди, гравець має припинити використання сервісів SurvivalBoom.
      1.2 Незнання правил не звільняє від відповідальності. Злам облікового запису не є виправданням до порушення правил. Порушення правил з метою пожартувати не звільняє від відповідальності, а навпаки може стати фактором для посилення жорстокості покарання.
      1.3 Адміністрація SurvivalBoom має право змінювати правила у будь-який час, сповістивши про зміни на інформаційних ресурсах проєкту (сайт, спільнота Discord, майнкрафт сервер).
      1.3 Адміністрація SurvivalBoom керує проєктом суто на власний розсуд і має право забрати доступ у гравців до окремих сервісів або усього проєкту у будь-який момент без пояснення причин чи забов'язань.
      1.4 Правила SurvivalBoom існують лише для розуміння гравцями за які дії можна отримати покарання. Адміністрація може інтерпретувати правила будь-яким чином в залежності від ситуації.
      1.5 За жодних умов адміністрація SurvivalBoom не має перед гравцями ніяких забов'язань.
      1.6 Заборонений будь-який обхід покарань, у тому числі за допомогою других акаунтів. 
      1.7 Будь-які прояви самосуду суворо заборонені, порушення правил має розглядати адміністрація. При самосуді буде покарані порушник та особи які вчиняли самосуд.  
  
