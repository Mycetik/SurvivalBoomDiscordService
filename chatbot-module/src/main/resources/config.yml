      3.1 Заборонено видавати себе за іншу людину та вводити в оману інших користувачів. До цього входить також реєстрація нікнеймів схожих на нікнейми інших учасників та адміністрації.
      3.2 Заборонена торгівля акаунтами та злам.
      3.3 Заборонено публікувати особисті дані людини (у тому числі дані які людина не бажає розголошувати публічно).
