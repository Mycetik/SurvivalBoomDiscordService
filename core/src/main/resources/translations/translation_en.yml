$name: "english"
$display-name: "$[lang.english]"
$icon: "🇺🇸"
$locale: ENGLISH_US

lang:
  ukrainian: "Ukrainian"
  russian: "Russian"
  english: "English"

values:
  true: "Yes"
  false: "No"
  none: "None"

sbds:

  config:
    prefix: "Command prefix"

  command:

    status:
      description: "Shows a status of the discord bot."

  loading:
    $embed:
      description: "<a:loading:1086970461549756536> Processing your request, please wait..."
      color: f9f06b

  error:
    $embed:
      title: ":bangbang: Oops! :bangbang:"
      color: ff0000
      description: |
        An internal error occurred while attempting to process your request!
        Information about the error sent to bot's console. Try again later or contact bot's developer.
      fields:
        - name: "Exception:"
          value: "{exception}"

  no-permission:
    $embed:
      title: "You don't have a permission!"
      color: ff0000
      description: |
        Looks like you don't have a permission required to use this.  
        Contact server admin, if you think that this is an error.
        Permission: `{permission}`.

  invalid-interaction:
    $embed:
      title: "Invalid interaction!"
      color: ff0000
      description: |
        Looks like this interaction was expired or does not exist!
        Try again or contact bot's developer.
      footer: "Interaction id: {id}"