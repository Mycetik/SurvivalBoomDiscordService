$name: "ukrainian"
$display-name: "$[lang.ukrainian]"
$icon: "🇺🇦"

lang:
  ukrainian: "Українська"
  russian: "Російська"
  english: "Англійська"

commands:

  error:
    $embed:
      title: ":bangbang: Ой-ой! :bangbang:"
      color: ff0000
      description: |
        Сталась невідома помилка у SBDS при спробі виконати команду!
        Інформацію про помилку надіслано у консоль. Спробуйте виконати команду пізніше або зв'яжіться з розробником.
      fields:
        - name: "Помилка:"
          value: "{EXCEPTION}"

  no-permission:
    $embed:
      title: "У вас немає доступу!"
      color: ff0000
      description: |
        Отакої! Схоже, що вам бракує дозволів для використання цієї команди!
        Спробуйте звернутись до адміністратора, якщо ви думаєте що це помилка.
        Необхідний дозвіл: `{PERMISSION}`.

  sbds:

    status:
      $embed:
        title: "О холеро! Чи то фреді фазбер???"
        description: "ЕУ ЕУ ЕВАЕ ЕУ УЕ УЕ"
        fields:
          - name: "Хрюкі"
            value: "Хрюкнеш, хохліна?"