$name: "ukrainian"
$display-name: "$[lang.ukrainian]"
$icon: "🇺🇦"
$locale: UKRAINIAN

lang:
  ukrainian: "Українська"
  russian: "Російська"
  english: "Англійська"

values:
  true: "Так"
  false: "Ні"
  none: "Немає"

sbds:

  config:
    prefix: "Префікс команд"

  command:

    status:
      description: "Відображає статус діскорд бота."

  loading:
    $embed:
      description: "<a:loading:1086970461549756536> Оброблюємо ваш запит, зачекайте..."
      color: f9f06b

  error:
    $embed:
      title: ":bangbang: Ой-ой! :bangbang:"
      color: ff0000
      description: |
        Сталась невідома помилка у SBDS при спробі обробити ваш запит!
        Інформацію про помилку надіслано у консоль. Спробуйте ще раз пізніше або зв'яжіться з розробником.
      fields:
        - name: "Помилка:"
          value: "{exception}"

  no-permission:
    $embed:
      title: "У вас немає доступу!"
      color: ff0000
      description: |
        Отакої! Схоже, що вам бракує дозволів для цього!
        Спробуйте звернутись до адміністратора, якщо ви думаєте що це помилка.
        Необхідний дозвіл: `{permission}`.

  invalid-interaction:
    $embed:
      title: "Невірна взаємодія!"
      color: ff0000
      description: |
        Отакої! Схоже, що цієї взаємодії не існує!
        Можливо ця дія прострочилась або ви намагаєтесь зробити щось неможливе.
        Спробуйте виконати команду ще раз або зверніться до розробника, якщо ви думаєте що це помилка.
      footer: "Interaction id: {id}"