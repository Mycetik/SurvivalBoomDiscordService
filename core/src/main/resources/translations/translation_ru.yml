$name: "russian"
$display-name: "$[lang.russian]"
$icon: "🇷🇺"

lang:
  ukrainian: "Украинский"
  russian: "Русский"
  english: "Английский"

commands:

  error:
    $embed:
      title: ":bangbang: Ой-ой! :bangbang:"
      color: ff0000
      description: |
        Произошла неизвестная ошибка при попытке исполнить команду!
        Информацию про ошибку отправлено в консоль. Попробуйте выполнить команду позже или свяжитесь с разработчиком.
      fields:
        - name: "Ошибка:"
          value: "{EXCEPTION}"

  no-permission:
    $embed:
      title: "У вас нету доступа!"
      color: ff0000
      description: |
        Ой-ой! Похоже, что у вас недостаточно прав для использования этой команды.
        Попробуйте обратиться к администрации, если вы думаете что это ошибка.
        Необходимое разрешение: `{PERMISSION}`.