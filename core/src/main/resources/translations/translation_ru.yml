$name: "russian"
$display-name: "$[lang.russian]"
$icon: "🇷🇺"
$discord-locale: RUSSIAN

lang:
  ukrainian: "Украинский"
  russian: "Русский"
  english: "Английский"

sbds:

  error:
    $embed:
      title: ":bangbang: Ой-ой! :bangbang:"
      color: ff0000
      description: |
        Произошла неизвестная ошибка при попытке обработать ваш запрос!
        Информацию про ошибку отправлено в консоль. Попробуйте позже или свяжитесь с разработчиком.
      fields:
        - name: "Ошибка:"
          value: "{EXCEPTION}"

  no-permission:
    $embed:
      title: "У вас нету доступа!"
      color: ff0000
      description: |
        Ой-ой! Похоже, что у вас недостаточно прав для использования этого.
        Попробуйте обратиться к администрации, если вы думаете что это ошибка.
        Необходимое разрешение: `{PERMISSION}`.

  invalid-interaction:
    $embed:
      title: "Неправильное взаимодействие!"
      color: ff0000
      description: |
        Ой-ой! Похоже, этого взаимодействия не существует.
        Может быть это взаимодействие больше недоступно или вы пытаетесь сделать невозможное.
        Попробуйте вызвать команду еще раз или обратитесь к разработчику, если вы думаете что это ошибка.
      footer: "Interaction id: {ID}"