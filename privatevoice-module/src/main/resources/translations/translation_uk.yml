#
# SurvivalBoom Discord Service | SurvivalBoom Network 2026
#         Private Voice Module | By TIMURishche
#

$name: "sbds:ukrainian"

voice:

  config:
    label: "Приватні канали"
    creator: "Канал-створювач"
    fallback: "Резервний канал"

  control:

    not-in-voice:
      $embed:
        title: Ви не знаходитесь у приватному каналі!
        color: ff0000
        description: |
          Ви не знаходитесь у приватному голосовому каналі!
          Не втрачайте унікальну можливість та створіть свій власний вже зараз!

    not-owner:
      $embed:
        title: Ви не є власником!
        color: ff0000
        description: |
          Ви не є власником цього приватного каналу!
          Не втрачайте унікальну можливість та створіть свій власний вже зараз!

    panel:
      $embed:
        title: ":satellite_orbital: SurvivalBoom :satellite_orbital:"
        color: 4188fa
        description: |
          :level_slider: Панель керування голосовим каналом.
          
          :loud_sound: Голосовий канал: {channel.mention} 
          :crown: Власник: {owner.mention}
          
          :lock: Заблоковано: `{locked}` 
          :eyeglasses: Приховано: `{hidden}`
          
          :white_check_mark: Дозволені користувачі: `{whitelist}`
          :beginner: Заблоковані користувачі: `{blacklist}` 
          :microphone2: Замучені користувачі: `{muted}` 
          
          :eight_spoked_asterisk: Загубили панель? Напишіть `+` щоб відправити панель знову.
      $components:

        - name: privatevoicemodule:action
          static: true
          type: STRING_SELECT
          options:

            - id: "change-name"
              title: "Назва каналу"
              description: "Змінити назву каналу."
              emoji: "📑"

            - id: "set-limit"
              title: "Ліміт користувачів"
              description: "Змінити ліміт користувачів каналу."
              emoji: "🪬"

            - id: "lock"
              title: "Заблокувати/Розблокувати"
              description: "Керувати доступом до каналу."
              emoji: "🔐"

            - id: "hide"
              title: "Сховати/Показати"
              description: "Керувати видимістю вашого каналу."
              emoji: "👁️"

            - id: "blacklist"
              title: "Чорний список"
              description: "Керувати блокуванням користувачів."
              emoji: "📕"

            - id: "whitelist"
              title: "Білий список"
              description: "Керувати білим списком користувачів."
              emoji: "📘"

            - id: "mute"
              title: "Керування мутами"
              description: "Вимкнути/увімкнути мікрофон користувачу."
              emoji: "🎙️"

            - id: "delete"
              title: "Видалити"
              description: "Видалити приватний канал."
              emoji: "🗑️"

    rename:

      modal:
        title: "Змінити назву каналу"
        input-name: "Нова назва"
        input-placeholder: "Уведіть..."

      success:
        $embed:
          title: "Назву змінено!"
          color: 4188fa
          description: "Ви змінили назву каналу на `{name}`."

    set-limit:

      modal:
        title: "Максимум учасників"
        input-name: "Кількість учасників"
        input-placeholder: "Уведіть..."

      success:
        $embed:
          title: "Кількість учасників змінено!"
          color: 4188fa
          description: "Ви змінили максимальну кількість учасників на `{limit}`."

      invalid:
        $embed:
          title: "Неправильне число!"
          color: ff0000
          description: |
            Ви маєте вказати число від **1** до **50**.
            Ваша відповідь `{input}` неправильна, оскільки не є числом.

    lock:

      locked:
        $embed:
          title: "Канал заблоковано!"
          color: 4188fa
          description:  "Ви заблокували канал. Тепер ніхто не зможе зайти у цей канал."

      unlocked:
        $embed:
          title: "Канал розблоковано!"
          color: 4188fa
          description: "Ви розблокували канал. Тепер будь-хто зможе зайти у цей канал."

    hide:

      hidden:
        $embed:
          title: "Канал сховано!"
          color: 4188fa
          description: "Ви сховали канал. Тепер ніхто не зможе побачити цей канал."

      show:
        $embed:
          title: "Канал показано!"
          color: 4188fa
          description: "Ви показали канал. Тепер будь-хто зможе побачити цей канал."

    blacklist:

      self:
        $embed:
          title: "Ви не можете заблокувати самого себе!"
          color: ff0000
          description: |
            Ви спробували заблокувати самого себе. Ви дебіл.
            Живіть із цим.

      select:
        $content: "Оберіть учасника"
        $components:
          - name: member
            type: ENTITY_SELECT
            target: USER

      bot:
        $embed:
          title: "Заблокувати бота?"
          color: ff0000
          description: |
            Ви спробували заблокувати бота. Ви дебіл.
            Живіть із цим.
        
          

      added:
        $embed:
          title: "Користувача заблоковано!"
          color: 4188fa
          description: "Користувач {member.mention} заблоковано! Тепер він не зможе зайти у цей канал."

      removed:
        $embed:
          title: "Користувача розблоковано!"
          color: 4188fa
          description: "Користувача {member.mention} розблоковано! Тепер він зможе зайти у цей канал."

    whitelist:

      self:
        $embed:
          title: "Ви не можете додати у білий список самого себе!"
          color: ff0000
          description: |
            Ви власник каналу, ви не можете додати себе у білий список.
            Живіть із цим.

      bot:
        $embed:
          title: "Додати у білий список бота?"
          color: ff0000
          description: |
            Ви спробували додати у білий список бота. Ви дебіл.
            Живіть із цим.

      select:
        $content: "Оберіть учасника"
        $components:
          - name: member
            type: ENTITY_SELECT
            target: USER

      added:
        $embed:
          title: "Додано у білий список!"
          color: 4188fa
          description: "Користувача {member.mention} додано до білого списку."

      removed:
        $embed:
          title: "Видалено з білого списку!"
          color: 4188fa
          description: "Користувача {member.mention} видалено з білого списку."

    mute:

      self:
        $embed:
          title: "Ви не можете замутити самого себе!"
          color: ff0000
          description: |
            Ви спробували замутити самого себе. Ви дебіл.
            Живіть із цим.

      bot:
        $embed:
          title: "Замутити бота?"
          color: ff0000
          description: |
            Ви спробували замутити бота. Ви дебіл.
            Живіть із цим.

      not-in-voice:
        $embed:
          title: "Не у голосовому каналі!"
          color: ff0000
          description: |
            Цей користувач не знаходиться у вашому каналі. Тому ви не можете його замутити.
            Логічно?

      select:
        $content: "Оберіть учасника"
        $components:
          - name: member
            type: ENTITY_SELECT
            target: USER

      muted:
        $embed:
          title: "Користувача замучено!"
          color: 4188fa
          description: "Користувача {member.mention} замучено у цьому голосовому каналі."

      unmuted:
        $embed:
          title: "Користувача розмучено!"
          color: 4188fa
          description: "Користувача {member.mention} розмучено у цьому голосовому каналі."