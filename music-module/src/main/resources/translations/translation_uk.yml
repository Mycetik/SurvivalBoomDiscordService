$name: "ukrainian"

music:

  not-in-voice:
    $embed:
      description: <:9752barrierblockmc:1013463226752696392> Ви не знаходитесь у голосовому каналі.
      color: ff0000

  no-bot-in-voice:
    $embed:
      description: <:9752barrierblockmc:1013463226752696392> У вашому голосовому каналі немає музичного бота.
      color: ff0000

  command:

    #
    # /PLAY
    #

    play:

      description: "Шукає трек за вашим запитом й запускає музичного бота у вашому каналі."
      query:
        name: "запит"
        description: "Посилання на трек або пошуковий запит"

      no-free-bot:
        $embed:
          title: "Вільного бота не знайдено!"
          description: |
            Вільного музичного бота не знайдено!
            Можливо, вам варто спробувати ще раз пізніше.
          color: ff0000

      no-tracks-found:
        $embed:
          description: <:google_dinosaur:1077358570091319337> Результатів за запитом `{QUERY}` не знайдено!
          color: ff0000

      searching-tracks:
        $embed:
          description: <a:loading:1086970461549756536> Шукаю треки за запитом `{QUERY}`...
          color: ffce47

      loading-tracks:
        $embed:
          description: <a:loading:1086970461549756536> Завантажую треки за посиланням `{URL}`...
          color: ffce47

      load-failed:
        $embed:
          title: "Помилка завантаження!"
          description: |
            <:9752barrierblockmc:1013463226752696392> Сталась помилка при спробі завантажити трек. Можливо неправильне посилання або динозаврик усе зламав.
            ```
            {ERROR}
            ```
          color: ff0000

      playlist-added-single:
        $embed:

          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Додано у плейліст!"
          color: 8f00ff
          description: |
            Додано у плейліст:
            - `{ADDED-NAME}`
            Зараз грає:
            - `{PLAYING-NAME}`

          fields:

            - name: "Тривалість"
              value: "`{ADDED-DURATION}`"
              inline: true

            - name: "Джерело"
              value: "[{ADDED-SOURCE}]({ADDED-LINK})"
              inline: true

            - name: "Пісень в плейлісті"
              value: "`{PLAYLIST-SIZE}`"
              inline: true

        $components:

          - name: "musicmodule:back"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏮"

          - name: "musicmodule:pause"
            type: BUTTON
            style: SUCCESS
            static: true
            emoji: "⏯"

          - name: "musicmodule:next"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏭"

          - name: "musicmodule:stop"
            type: BUTTON
            style: DANGER
            static: true
            emoji: "🛑"

          - name: "musicmodule:lock"
            type: BUTTON
            style: SECONDARY
            static: true
            emoji: "🔒"

      playlist-added:
        $embed:

          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Додано `{TRACKS-COUNT}` треків у плейліст!"
          color: 8f00ff
          description: |
            Додано:
            {TRACKS}
            
            Зараз грає:
            - `{PLAYING-NAME}`

          fields:

            - name: "Тривалість"
              value: "`{PLAYING-DURATION}`"
              inline: true

            - name: "Джерело"
              value: "[{PLAYING-SOURCE}]({PLAYING-LINK})"
              inline: true

            - name: "Пісень в плейлісті"
              value: "`{PLAYLIST-SIZE}`"
              inline: true

        $components:

          - name: "musicmodule:back"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏮"

          - name: "musicmodule:pause"
            type: BUTTON
            style: SUCCESS
            static: true
            emoji: "⏯"

          - name: "musicmodule:next"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏭"

          - name: "musicmodule:stop"
            type: BUTTON
            style: DANGER
            static: true
            emoji: "🛑"

          - name: "musicmodule:lock"
            type: BUTTON
            style: SECONDARY
            static: true
            emoji: "🔒"


      connected:
        $embed:

          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Вільного бота знайдено!"
          color: 8f00ff
          description: |
            Зараз грає:
            - `{PLAYING-NAME}`

          fields:

            - name: "Тривалість"
              value: "`{PLAYING-DURATION}`"
              inline: true

            - name: "Джерело"
              value: "[{PLAYING-SOURCE}]({PLAYING-LINK})"
              inline: true

            - name: "Пісень в плейлісті"
              value: "`{PLAYLIST-SIZE}`"
              inline: true

        $components:

          - name: "musicmodule:back"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏮"

          - name: "musicmodule:pause"
            type: BUTTON
            style: SUCCESS
            static: true
            emoji: "⏯"

          - name: "musicmodule:next"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏭"

          - name: "musicmodule:stop"
            type: BUTTON
            style: DANGER
            static: true
            emoji: "🛑"

          - name: "musicmodule:lock"
            type: BUTTON
            style: SECONDARY
            static: true
            emoji: "🔒"


    #
    # /STOP
    #

    stop:

      description: "Зупиняє музичного бота у вашому каналі."

      success:
        $embed:
          description: "<:blurple_verified:1024732810667364414> Стоп! Музичного бота зупинено!"
          color: 8f00ff

    #
    # /SKIP
    #

    skip:

      description: "Пропускає поточу пісню у музичному боті."

      steps:
        name: "кількість"
        description: "Кількість пісень для пропуску"

      invalid-index:
        $embed:
          title: "Неправильний індекс"
          color: ff0000
          description: "Вкажіть правильний індекс від `0` до `{PLAYLIST-SIZE}`."

      multiple:
        $embed:

          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Пропущено `{SKIP}` пісень!"
          color: 8f00ff
          description: |
            Зараз грає:
            - `{PLAYING-NAME}`

          fields:

            - name: "Тривалість"
              value: "`{PLAYING-DURATION}`"
              inline: true

            - name: "Джерело"
              value: "[{PLAYING-SOURCE}]({PLAYING-LINK})"
              inline: true

            - name: "Пісень в плейлісті"
              value: "`{PLAYLIST-SIZE}`"
              inline: true

        $components:

          - name: "musicmodule:back"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏮"

          - name: "musicmodule:pause"
            type: BUTTON
            style: SUCCESS
            static: true
            emoji: "⏯"

          - name: "musicmodule:next"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏭"

          - name: "musicmodule:stop"
            type: BUTTON
            style: DANGER
            static: true
            emoji: "🛑"

          - name: "musicmodule:lock"
            type: BUTTON
            style: SECONDARY
            static: true
            emoji: "🔒"

      single:
        $embed:

          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Пісню пропущено!"
          color: 8f00ff
          description: |
            Пропущено:
            - `{SKIPPED-NAME}`
            Зараз грає:
            - `{PLAYING-NAME}`

          fields:

            - name: "Тривалість"
              value: "`{PLAYING-DURATION}`"
              inline: true

            - name: "Джерело"
              value: "[{PLAYING-SOURCE}]({PLAYING-LINK})"
              inline: true

            - name: "Пісень в плейлісті"
              value: "`{PLAYLIST-SIZE}`"
              inline: true

        $components:

          - name: "musicmodule:back"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏮"

          - name: "musicmodule:pause"
            type: BUTTON
            style: SUCCESS
            static: true
            emoji: "⏯"

          - name: "musicmodule:next"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏭"

          - name: "musicmodule:stop"
            type: BUTTON
            style: DANGER
            static: true
            emoji: "🛑"

          - name: "musicmodule:lock"
            type: BUTTON
            style: SECONDARY
            static: true
            emoji: "🔒"

    #
