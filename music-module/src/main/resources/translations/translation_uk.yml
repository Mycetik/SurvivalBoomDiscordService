            static: true
            emoji: "🛑"

          - name: "musicmodule:lock"
            type: BUTTON
            style: SECONDARY
            static: true
            emoji: "🔒"


    #
    # /PLAYLIST
    #
    playlist:

      description: "Відображає поточний плейліст музичного бота."

      success:
        $embed:
          title: "Плейліст з `{COUNT}` пісень."
          description: "{PLAYLIST}"

    #
    # /LOOP
    #
    loop:

      description: "Задає режим повторення треків у музичному боті."


      mode:
        name: "режим"
        description: "Режим повторювання треків"
        choices:
          off: "Вимкнути"
          track: "Поточний трек"
          playlist: "Увесь плейліст"


      success:
        $embed:
          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Режим повторення"
          color: 8f00ff
          description: "Режим повторення змінено `{MODE}`."

    #
    # /LOCK
    #
    lock:

      description: "Блокує поточного музичного бота для використання тільки адміністратором."

      denied:
        $embed:
          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Музичний бот заблокований!"
          color: ff0000
          description: "Тільки персонал може керувати ним."

      locked:
        $embed:
          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Музичного бота заблоковано!"
          color: 8f00ff
          description: "Тепер тільки персонал зможе керувати ним."

      unlocked:
        $embed:
          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Музичного бота розблоковано!"
          color: 8f00ff
          description: "Тепер будь-хто зможе керувати ним."

    #
    # /MUSIC-BAN
    #
    music-ban:

      description: "Забороняє користувачу використати музичного бота."
      target:
        name: "учасник"
        description: "Учасник якого потрібно заблокувати."

      denied:
        $embed:
          title: "Ви заблоковані! Отакої!"
          color: ff0000
          description: |
            Адміністратор заборонив вам використовувати музичного бота!
            Можливо вам варто подумати над вашою поведінкою...

      banned:
        $embed:
          title: "Користувача заблоковано!"
          color: 8f00ff
          description: |
            Ви заборонили доступ до музичного бота користувачу {USER}.
            Тепер цей користувач не зможе використовувати музичного бота.

      unbanned:
        $embed:
          title: "Користувача розблоковано!"
          color: 8f00ff
          description: |
            Ви дозволили доступ до музичного бота користувачу {USER}.
            Тепер цей користувач знову може використовувати музичного бота.
    
    

    #
    # /PAUSE
    #
    pause:

      description: "Призупиняє або відновлює відтворення поточного треку в музичному боті."

      paused:
        $embed:
          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Пауза!"
          color: 8f00ff
          description: "Поточний трек призупинено."

      resumed:
        $embed:
          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Продовжено!"
          color: 8f00ff
          description: "Програвання поточного треку продовжено."

    #
    # /music-24-7
    #
    24-7:

      description: "Змушує музичного бота залишатись у голосовому каналі, навіть якщо нікого немає."

      enable:
        $embed:
          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Режим 24/7 увімкнено!"
          color: 8f00ff
          description: "Тепер бот не буде виходити з цього каналу та повторювати плейлист."

      disable:
        $embed:
          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Режим 24/7 вимкнено!"
          color: 8f00ff
          description: "Тепер бот буде виходити з цього каналу, при закінченні плейлісту."