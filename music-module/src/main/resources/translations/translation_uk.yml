    #
    back:

      description: "Повертає минулу пісню у музичному боті."

      steps:
        name: "кількість"
        description: "Кількість пісень для повернення"

      multiple:
        $embed:

          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Пропущено `{COUNT}` пісень!"
          color: 8f00ff
          description: |
