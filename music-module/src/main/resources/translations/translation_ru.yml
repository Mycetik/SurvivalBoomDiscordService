          - name: "musicmodule:stop"
            type: BUTTON
            style: DANGER
            static: true
            emoji: "🛑"

          - name: "musicmodule:lock"
            type: BUTTON
            style: SECONDARY
            static: true
            emoji: "🔒"


    #
    # /PLAYLIST
    #
    playlist:

      description: "Выводит текущий плелист музыкального бота."

      success:
        $embed:
          title: "Плейлист из `{COUNT}` песен."
          description: "{PLAYLIST}"

    #
    # /LOOP
    #
    loop:

      description: "Устанавливает режим повтора треков в музыкальном боте."

      mode:
        name: "режим"
        description: "Режим повтора треков"
        choices:
          disabled: "Выключить"
          track: "Текущий трек"
          playlist: "Весь плейлист"


      success:
        $embed:
          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Повтор"
          color: 8f00ff
          description: "Режим повторения треков изменен на `{MODE}`."

    #
    # /LOCK
    #
    lock:

      description: "Блокирует текущего музыкального бота для использования только администрацией."

      denied:
        $embed:
          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Музыкальный бот заблокирован!"
          color: ff0000
          description: "Только персонал может управлять им."

      locked:
        $embed:
          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Музыкальный бот заблокирован!"
          color: 8f00ff
          description: "Теперь только персонал сможет управлять им."

      unlocked:
        $embed:
          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Музыкальный бот разблокирован!"
          color: 8f00ff
          description: "Теперь любой может им управлять."

    #
    # /MUSIC-BAN
    #
    music-ban:

      description: "Запрещает пользователю использовать музыкального бота."
      target:
        name: "пользователь"
        description: "Пользователь которого нужно заблокировать."

      denied:
        $embed:
          title: "Вы заблокированы! Как же так?"
          color: ff0000
          description: |
            Администратор запретил вам использовать музыкального бота.
            Может быть вам стоит подумать над своим поведением...

      banned:
        $embed:
          title: "Пользователь заблокирован!"
          color: 8f00ff
          description: |
            Вы запретили пользователю {USER} использовать музыкального бота.
            Теперь этот пользователь не сможет использовать музыкального бота.

      unbanned:
        $embed:
          title: "Пользователь разблокирован!"
          color: 8f00ff
          description: |
            Вы разрешили пользователю {USER} использовать музыкального бота.
            Теперь этот пользователь может использовать музыкального бота.
    
    

    #
    # /PAUSE
    #
    pause:

      description: "Приостанавливает текущий трек в музыкальном боте."

      paused:
        $embed:
          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Пауза!"
          color: 8f00ff
          description: "Проигрывание текущего трека приостановлено."

      resumed:
        $embed:
          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Снято с паузы!"
          color: 8f00ff
          description: "Проигрывание текущего трека возобновлено!"

    #
    # /music-24-7
    #
    24-7:

      description: "Выключает выход музыкального бота из голосового канала при неактивности."

      enable:
        $embed:
          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Режим 24/7 включен!"
          color: 8f00ff
          description: "Теперь бот не будет покидать текущий голосовой канал."

      disable:
        $embed:
          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Режим 24/7 выключен!"
          color: 8f00ff
          description: "Тепер бот будет покидать текущий голосовой канал при бездействии."