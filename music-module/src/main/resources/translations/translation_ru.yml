$name: "russian"

music:

  not-in-voice:
    $embed:
      description: <:9752barrierblockmc:1013463226752696392> Вы не находитесь в голосовом канале.
      color: ff0000

  no-bot-in-voice:
    $embed:
      description: <:9752barrierblockmc:1013463226752696392> В вашем голосовом канале нет музыкального бота.
      color: ff0000

  command:

    #
    # /PLAY
    #

    play:

      description: "Находит трек за вашим запросом и запускает музыкального бота в вашем канале."
      query:
        name: "запрос"
        description: "Ссылка на трек или поисковый запрос"

      no-free-bot:
        $embed:
          title: "Бот не найден!"
          description: |
            Свободный бот не найден. Попробуйте еще раз позже
          color: ff0000

      no-tracks-found:
        $embed:
          description: <:google_dinosaur:1077358570091319337> Результатов по запросу `{QUERY}` не найдено!
          color: ff0000

      searching-tracks:
        $embed:
          description: <a:loading:1086970461549756536> Поиск треков по запросу `{QUERY}`...
          color: ffce47

      loading-tracks:
        $embed:
          description: <a:loading:1086970461549756536> Загружаем треки с `{URL}`...
          color: ffce47

      load-failed:
        $embed:
          title: "Ошибка загрузки!"
          description: |
            <:9752barrierblockmc:1013463226752696392> Произошла ошибка при попытке загрузки трека. Может вы указали неправильну ссылку или динозаврик отгрыз что-то важное в коде.
            ```
            {ERROR}
            ```
          color: ff0000

      playlist-added-single:
        $embed:

          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Добавлено в плейлист!"
          color: 8f00ff
          description: |
            Добавлено в плейлист:
            - `{ADDED-NAME}`
            Сейчас играет:
            - `{PLAYING-NAME}`

          fields:

            - name: "Длительность"
              value: "`{ADDED-DURATION}`"
              inline: true

            - name: "Источник"
              value: "[{ADDED-SOURCE}]({ADDED-LINK})"
              inline: true

            - name: "Треков в плейлисте"
              value: "`{PLAYLIST-SIZE}`"
              inline: true

        $components:

          - name: "musicmodule:back"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏮"

          - name: "musicmodule:pause"
            type: BUTTON
            style: SUCCESS
            static: true
            emoji: "⏯"

          - name: "musicmodule:next"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏭"

          - name: "musicmodule:stop"
            type: BUTTON
            style: DANGER
            static: true
            emoji: "🛑"

          - name: "musicmodule:lock"
            type: BUTTON
            style: SECONDARY
            static: true
            emoji: "🔒"

      playlist-added:
        $embed:

          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Добавлено `{TRACKS-COUNT}` треков в плейлист!"
          color: 8f00ff
          description: |
            Добавлено:
            {TRACKS}
            
            Сейчас играет:
            - `{PLAYING-NAME}`

          fields:

            - name: "Длительность"
              value: "`{PLAYING-DURATION}`"
              inline: true

            - name: "Источник"
              value: "[{PLAYING-SOURCE}]({PLAYING-LINK})"
              inline: true

            - name: "Треков в плейлисте"
              value: "`{PLAYLIST-SIZE}`"
              inline: true

        $components:

          - name: "musicmodule:back"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏮"

          - name: "musicmodule:pause"
            type: BUTTON
            style: SUCCESS
            static: true
            emoji: "⏯"

          - name: "musicmodule:next"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏭"

          - name: "musicmodule:stop"
            type: BUTTON
            style: DANGER
            static: true
            emoji: "🛑"

          - name: "musicmodule:lock"
            type: BUTTON
            style: SECONDARY
            static: true
            emoji: "🔒"


      connected:
        $embed:

          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Свободный бот найден!"
          color: 8f00ff
          description: |
            Сейчас играет:
            - `{PLAYING-NAME}`

          fields:

            - name: "Длительность"
              value: "`{PLAYING-DURATION}`"
              inline: true

            - name: "Источник"
              value: "[{PLAYING-SOURCE}]({PLAYING-LINK})"
              inline: true

            - name: "Треков в плейлисте"
              value: "`{PLAYLIST-SIZE}`"
              inline: true

        $components:

          - name: "musicmodule:back"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏮"

          - name: "musicmodule:pause"
            type: BUTTON
            style: SUCCESS
            static: true
            emoji: "⏯"

          - name: "musicmodule:next"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏭"

          - name: "musicmodule:stop"
            type: BUTTON
            style: DANGER
            static: true
            emoji: "🛑"

          - name: "musicmodule:lock"
            type: BUTTON
            style: SECONDARY
            static: true
            emoji: "🔒"


    #
    # /STOP
    #

    stop:

      description: "Останавливает музыкального бота в вашем канале."

      success:
        $embed:
          description: "<:blurple_verified:1024732810667364414> Стоп! Музыкальный бот остановлен!"
          color: 8f00ff

    #
    # /SKIP
    #

    skip:

      description: "Пропускает текущий трек в музыкальном боте."

      steps:
        name: "количество"
        description: "Количество треков для пропуска"

      invalid-index:
        $embed:
          title: "Неправильный индекс"
          color: ff0000
          description: "Укажите правильный индекс от `0` до `{PLAYLIST-SIZE}`."

      multiple:
        $embed:

          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Пропущено `{SKIP}` треков!"
          color: 8f00ff
          description: |
            Сейчас играет:
            - `{PLAYING-NAME}`

          fields:

            - name: "Длительность"
              value: "`{PLAYING-DURATION}`"
              inline: true

            - name: "Источник"
              value: "[{PLAYING-SOURCE}]({PLAYING-LINK})"
              inline: true

            - name: "Треков в плейлисте"
              value: "`{PLAYLIST-SIZE}`"
              inline: true

        $components:

          - name: "musicmodule:back"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏮"

          - name: "musicmodule:pause"
            type: BUTTON
            style: SUCCESS
            static: true
            emoji: "⏯"

          - name: "musicmodule:next"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏭"

          - name: "musicmodule:stop"
            type: BUTTON
            style: DANGER
            static: true
            emoji: "🛑"

          - name: "musicmodule:lock"
            type: BUTTON
            style: SECONDARY
            static: true
            emoji: "🔒"

      single:
        $embed:

          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Трек пропущено!"
          color: 8f00ff
          description: |
            Пропущено:
            - `{SKIPPED-NAME}`
            Сейчас играет:
            - `{PLAYING-NAME}`

          fields:

            - name: "Длительность"
              value: "`{PLAYING-DURATION}`"
              inline: true

            - name: "Источник"
              value: "[{PLAYING-SOURCE}]({PLAYING-LINK})"
              inline: true

            - name: "Треков в плейлисте"
              value: "`{PLAYLIST-SIZE}`"
              inline: true

        $components:

          - name: "musicmodule:back"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏮"

          - name: "musicmodule:pause"
            type: BUTTON
            style: SUCCESS
            static: true
            emoji: "⏯"

          - name: "musicmodule:next"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏭"

          - name: "musicmodule:stop"
            type: BUTTON
            style: DANGER
            static: true
            emoji: "🛑"

          - name: "musicmodule:lock"
            type: BUTTON
            style: SECONDARY
            static: true
            emoji: "🔒"

    #
