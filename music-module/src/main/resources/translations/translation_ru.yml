    #
    back:

      description: "Возврващает прошлый трек в музыкальном боте."

      steps:
        name: "количество"
        description: "Количество треков для пропуска"

      multiple:
        $embed:

          author: "{BOT}"
          author-icon: "{BOT-AVATAR}"

          title: "Пропущено `{COUNT}` песен!"
          color: 8f00ff
          description: |
            Сейчас играет:
            - `{PLAYING-NAME}`

          fields:

            - name: "Длительность"
