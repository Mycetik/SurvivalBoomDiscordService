          color: 8f00ff
          description: |
            Пропущено:
            - `{SKIPPED-NAME}`
            Сейчас играет:
            - `{PLAYING-NAME}`

          fields:

            - name: "Длительность"
              value: "`{PLAYING-DURATION}`"
              inline: true

            - name: "Источник"
              value: "[{PLAYING-SOURCE}]({PLAYING-LINK})"
              inline: true

            - name: "Треков в плейлисте"
