$name: sbds:english

music:

  not-in-voice:
    $embed:
      description: <:9752barrierblockmc:1013463226752696392> You are not in a voice channel.
      color: ff0000

  no-bot-in-voice:
    $embed:
      description: <:9752barrierblockmc:1013463226752696392> No music bot is in your voice channel.
      color: ff0000

  command:

    play:

      description: "Searches for a track by your query and starts the music bot in your channel."
      query:
        name: "query"
        description: "Track URL or search query"

      no-free-bot:
        $embed:
          title: "No Free Bot Found!"
          description: |
            No free music bot was found!
            Try again later maybe.
          color: ff0000

      connect-failed:
        $embed:
          title: "Failed to connect :("
          description: |
            Bot {bot.name} could not connect to {CHANNEL}.
            Maybe bot does not have enough permissions?
          color: ff0000

      no-tracks-found:
        $embed:
          description: <:google_dinosaur:1077358570091319337> No results found for `{QUERY}`!
          color: ff0000

      searching-tracks:
        $embed:
          description: <a:loading:1086970461549756536> Searching for tracks by `{QUERY}`...
          color: ffce47

      loading-tracks:
        $embed:
          description: <a:loading:1086970461549756536> Loading tracks from `{URL}`...
          color: ffce47

      load-failed:
        $embed:
          title: "Load Error!"
          description: |
            <:9752barrierblockmc:1013463226752696392> Failed to load track. Bad link or something just broke.
            ```
            {ERROR}
            ```
          color: ff0000

      playlist-added-single:
        $embed:
          author: "{bot.name}"
          author-icon: "{bot.avatar}"
          title: "Added to Playlist!"
          color: 8f00ff
          description: |
            Added to playlist:
            - `{ADDED-NAME}`
            Now playing:
            - `{PLAYING-NAME}`
          fields:
            - name: "Duration"
              value: "`{added.duration}`"
              inline: true
            - name: "Source"
              value: "[{added.source}]({added.link})"
              inline: true
            - name: "Playlist Size"
              value: "`{playlist.size}`"
              inline: true

        $components:
          - name: "musicmodule:back"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏮"
          - name: "musicmodule:pause"
            type: BUTTON
            style: SUCCESS
            static: true
            emoji: "⏯"
          - name: "musicmodule:next"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏭"
          - name: "musicmodule:stop"
            type: BUTTON
            style: DANGER
            static: true
            emoji: "🛑"
          - name: "musicmodule:lock"
            type: BUTTON
            style: SECONDARY
            static: true
            emoji: "🔒"

      playlist-added:
        $embed:
          author: "{bot.name}"
          author-icon: "{bot.avatar}"
          title: "`{count}` Tracks Added to Playlist!"
          color: 8f00ff
          description: |
            Added:
            {TRACKS}
            
            Now playing:
            - `{PLAYING-NAME}`
          fields:
            - name: "Duration"
              value: "`{playing.duration}`"
              inline: true
            - name: "Source"
              value: "[{playing.source}]({playing.link})"
              inline: true
            - name: "Playlist Size"
              value: "`{playlist.size}`"
              inline: true

        $components:
          - name: "musicmodule:back"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏮"
          - name: "musicmodule:pause"
            type: BUTTON
            style: SUCCESS
            static: true
            emoji: "⏯"
          - name: "musicmodule:next"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏭"
          - name: "musicmodule:stop"
            type: BUTTON
            style: DANGER
            static: true
            emoji: "🛑"
          - name: "musicmodule:lock"
            type: BUTTON
            style: SECONDARY
            static: true
            emoji: "🔒"

      connected:
        $embed:
          author: "{bot.name}"
          author-icon: "{bot.avatar}"
          title: "Free Bot Found!"
          color: 8f00ff
          description: |
            Now playing:
            - `{PLAYING-NAME}`
          fields:
            - name: "Duration"
              value: "`{playing.duration}`"
              inline: true
            - name: "Source"
              value: "[{playing.source}]({playing.link})"
              inline: true
            - name: "Playlist Size"
              value: "`{playlist.size}`"
              inline: true

        $components:
          - name: "musicmodule:back"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏮"
          - name: "musicmodule:pause"
            type: BUTTON
            style: SUCCESS
            static: true
            emoji: "⏯"
          - name: "musicmodule:next"
            type: BUTTON
            style: PRIMARY
            static: true
            emoji: "⏭"
          - name: "musicmodule:stop"
            type: BUTTON
            style: DANGER
            static: true
            emoji: "🛑"
          - name: "musicmodule:lock"
            type: BUTTON
            style: SECONDARY
            static: true
            emoji: "🔒"

    stop:
      description: "Stops the music bot in your channel."
      success:
        $embed:
          description: "<:blurple_verified:1024732810667364414> Stop! Music bot has been stopped!"
          color: 8f00ff

    skip:
      description: "Skips the current song in the music bot."
      steps:
        name: "amount"
        description: "Number of songs to skip"
      invalid-index:
        $embed:
          title: "Invalid Index"
          color: ff0000
          description: "Specify a valid index from `0` to `{playlist.size}`."

      multiple:
        $embed:
          author: "{bot.name}"
          author-icon: "{bot.avatar}"
          title: "`{count}` Songs Skipped!"
          color: 8f00ff
          description: |
            Now playing:
            - `{PLAYING-NAME}`
          fields:
