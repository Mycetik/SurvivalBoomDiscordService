            static: true
            emoji: "🛑"
          - name: "musicmodule:lock"
            type: BUTTON
            style: SECONDARY
            static: true
            emoji: "🔒"

      single:
        $embed:
          author: "{bot.name}"
          author-icon: "{bot.avatar}"
          title: "Song Skipped!"
          color: 8f00ff
          description: |
            Skipped:
            - `{SKIPPED-NAME}`
            Now playing:
            - `{PLAYING-NAME}`
          fields:
            - name: "Duration"
