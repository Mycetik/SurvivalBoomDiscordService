    playlist:
      description: "Displays the current music bot playlist."
      success:
        $embed:
          title: "Playlist of `{playlist.size}` songs."
          description: "{playlist}"

    loop:
      description: "Sets the loop mode for tracks in the music bot."
      mode:
        name: "mode"
        description: "Loop mode"
        choices:
          disabled: "Off"
          track: "Current Track"
          playlist: "Playlist"


      success:
        $embed:
          author: "{bot.name}"
          author-icon: "{bot.avatar}"
          title: "Loop Mode"
          color: 8f00ff
          description: "Loop mode changed to `{mode}`."

    lock:
      description: "Locks the current music bot to be used only by admin."
      denied:
        $embed:
          author: "{bot.name}"
          author-icon: "{bot.avatar}"
          title: "Bot is Locked!"
          color: ff0000
          description: "Only staff can control it."

      locked:
        $embed:
          author: "{bot.name}"
          author-icon: "{bot.avatar}"
          title: "Music Bot Locked!"
          color: 8f00ff
          description: "Only staff can control it now."

      unlocked:
        $embed:
          author: "{bot.name}"
          author-icon: "{bot.avatar}"
          title: "Music Bot Unlocked!"
          color: 8f00ff
          description: "Anyone can control it now."

    music-ban:
      description: "Bans a user from using the music bot."
      target:
        name: "user"
        description: "User to ban from using the bot."
      denied:
        $embed:
          title: "You're Banned! Oops!"
          color: ff0000
          description: |
            Admin has banned you from using the music bot!
            Maybe think about your behavior…

      banned:
        $embed:
          title: "User Banned!"
          color: 8f00ff
          description: |
            You have banned {USER} from using the music bot.
            They won't be able to use it anymore.

      unbanned:
        $embed:
          title: "User Unbanned!"
          color: 8f00ff
          description: |
            You have allowed {USER} to use the music bot again.

    pause:
      description: "Pauses or resumes the current track in the music bot."

      paused:
        $embed:
          author: "{bot.name}"
          author-icon: "{bot.avatar}"
          title: "Paused!"
          color: 8f00ff
          description: "Current track paused."

      resumed:
        $embed:
          author: "{bot.name}"
          author-icon: "{bot.avatar}"
          title: "Resumed!"
          color: 8f00ff
          description: "Resumed playback of current track."

    24-7:
      description: "Keeps the bot in voice channel even if no one's there."

      enable:
        $embed:
          author: "{bot.name}"
          author-icon: "{bot.avatar}"
          title: "24/7 Mode Enabled!"
          color: 8f00ff
          description: "Bot will now stay in the channel and repeat the playlist."

      disable:
        $embed:
          author: "{bot.name}"
          author-icon: "{bot.avatar}"
          title: "24/7 Mode Disabled!"
          color: 8f00ff
          description: "Bot will now leave the channel after the playlist ends."
